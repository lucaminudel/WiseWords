AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Template for ConversationsAndPosts Lambda + API Gateway with Cognito Authentication

Parameters:
  AllowedOrigin:
    Type: String
    Default: "https://doxsj8lfqq7dm.cloudfront.net"
  CognitoDomainPrefix:
    Type: String
    Default: "wisewords"
    Description: Globally unique domain prefix for Cognito Hosted UI (e.g., wisewords-prod)

Resources:
  # Cognito User Pool
  WiseWordsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: WiseWordsUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
        - Name: preferred_username
          AttributeDataType: String
          Required: true
        - Name: name
          AttributeDataType: String
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  # Cognito User Pool Domain for Hosted UI
  WiseWordsUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref WiseWordsUserPool

  # Cognito User Pool Client
  WiseWordsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref WiseWordsUserPool
      ClientName: WiseWordsWebClient
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "${AllowedOrigin}/callback"
      LogoutURLs:
        - !Ref AllowedOrigin
        - !Sub "${AllowedOrigin}/callback"
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      ReadAttributes:
        - email
        - name
        - preferred_username
      WriteAttributes:
        - email
        - name
        - preferred_username

  # Lambda Function with API Gateway
  ConversationsAndPostsAPI:
    Type: AWS::Serverless::Function
    Properties:
      Handler: WiseWords::WiseWords.ConversationsAndPosts.AWS.Lambdas.ApiGateway.Router::Dispatch
      Runtime: dotnet8
      CodeUri: publish.zip
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          WISEWORDS_ENV: aws_prod
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
        - AmazonDynamoDBFullAccess
      Events:
        # Protected POST endpoints
        PostConversations:
          Type: Api
          Properties:
            Path: /conversations
            Method: POST
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: WiseWordsCognitoAuthorizer
        PostDrilldown:
          Type: Api
          Properties:
            Path: /conversations/drilldown
            Method: POST
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: WiseWordsCognitoAuthorizer
        PostComment:
          Type: Api
          Properties:
            Path: /conversations/comment
            Method: POST
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: WiseWordsCognitoAuthorizer
        PostConclusion:
          Type: Api
          Properties:
            Path: /conversations/conclusion
            Method: POST
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: WiseWordsCognitoAuthorizer
        # Protected DELETE endpoints
        DeleteConversation:
          Type: Api
          Properties:
            Path: /conversations/{conversationId}
            Method: DELETE
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: WiseWordsCognitoAuthorizer
        # Public GET endpoints
        GetConversations:
          Type: Api
          Properties:
            Path: /conversations
            Method: GET
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: NONE
        GetConversationPosts:
          Type: Api
          Properties:
            Path: /conversations/{conversationId}/posts
            Method: GET
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: NONE
        # Public OPTIONS for CORS
        OptionsAny:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: OPTIONS
            RestApiId: !Ref WiseWordsApi
            Auth:
              Authorizer: NONE

  # API Gateway with Cognito Authorizer
  WiseWordsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'" 
        AllowCredentials: true
        MaxAge: 600  # Cache preflight response for 10 minutes
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
              Access-Control-Allow-Credentials: "'true'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
              Access-Control-Allow-Credentials: "'true'"
      Auth:
        DefaultAuthorizer: WiseWordsCognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          WiseWordsCognitoAuthorizer:
            UserPoolArn: !GetAtt WiseWordsUserPool.Arn

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref WiseWordsUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref WiseWordsUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  
  CognitoHostedUIUrl:
    Description: Cognito Hosted UI Login URL
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${WiseWordsUserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=${AllowedOrigin}/callback"
